name: Windows x64

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      mysql_version:
        description: 'MySQL version read from the vendored source tree'
        value: ${{ jobs.windows-x64.outputs.mysql_version }}
      package_name:
        description: 'Name of the uploaded Windows package artifact'
        value: ${{ jobs.windows-x64.outputs.package_name }}

env:
  # MySQL is built from the source tree vendored in this repository under
  # source/, not downloaded. The version is read from source/MYSQL_VERSION so
  # the built version can never disagree with the source that produced it.
  MYSQL_SOURCE_DIR: source
  # MySQL 8.0.25 requires OpenSSL 1.x; 1.1.x release tags keep the old naming.
  OPENSSL_VERSION: 1.1.1w
  OPENSSL_TAG: OpenSSL_1_1_1w
  # cmake/boost.cmake pins Boost exactly: a minor version other than 73 calls
  # COULD_NOT_FIND_BOOST() and fails the configure step. The plain MySQL source
  # tarball (which is what source/ holds) carries no boost/, so the headers are
  # fetched here. boost.cmake's own DOWNLOAD_BOOST points at dl.bintray.com,
  # which no longer exists, so the download is done here against the official
  # archive with a pinned checksum instead.
  BOOST_VERSION: 1.73.0
  BOOST_PACKAGE_NAME: boost_1_73_0
  BOOST_SHA256: 9995e192e68528793755692917f9eb6422f3052a53c5e13ba278a228af6c7acf
  PACKAGE_PLATFORM: windows-x64
  # The build and the install step must both name this configuration, so it
  # lives here rather than being spelled out twice. It cannot be Release: see
  # the "Configure and build MySQL from the vendored source" step. Note that
  # `cmake --install` falls
  # back to Release when --config is omitted, which is exactly the mismatch
  # the install step asserts against below.
  MSVC_CONFIG: RelWithDebInfo
  # Short roots keep the MySQL source and build trees clear of MAX_PATH limits.
  # The workspace path is already deep before MySQL's own nesting is added, so
  # the vendored source is copied to SOURCE_ROOT rather than built in place.
  SOURCE_ROOT: C:\mysql-src
  BUILD_ROOT: C:\mysql-build
  OPENSSL_ROOT: C:\openssl-x64
  BOOST_ROOT_DIR: C:\boost
  INSTALL_PREFIX: C:\mysql

jobs:
  windows-x64:
    name: Windows x64 / MSVC
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      mysql_version: ${{ steps.resolve.outputs.version }}
      package_name: ${{ steps.resolve.outputs.package_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The version is derived from the vendored source itself rather than being
      # declared anywhere, so there is no second place that could drift out of
      # step with what is actually compiled.
      - name: Resolve build inputs from the vendored source
        id: resolve
        shell: pwsh
        run: |
          Write-Output "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Output "MYSQL_SOURCE_DIR=$env:MYSQL_SOURCE_DIR"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE |
            Format-Table Mode, Name | Out-String | Write-Output

          # Preferred layout is <repo>\source\. Also accept the source sitting at
          # the repo root, or this tree living one level down inside a monorepo
          # that still runs this workflow (mysql\tag_v8.0.25\source).
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE $env:MYSQL_SOURCE_DIR),
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:GITHUB_WORKSPACE "mysql\tag_v8.0.25\$env:MYSQL_SOURCE_DIR"),
            (Join-Path $env:GITHUB_WORKSPACE "tag_v8.0.25\$env:MYSQL_SOURCE_DIR")
          )
          $source = $candidates | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'CMakeLists.txt')) -and
            (Test-Path -LiteralPath (Join-Path $_ 'MYSQL_VERSION'))
          } | Select-Object -First 1

          if (-not $source) {
            Write-Output 'Looked for a MySQL source tree (CMakeLists.txt + MYSQL_VERSION) in:'
            $candidates | ForEach-Object { Write-Output "  $_" }
            throw ('No MySQL source tree was found under ' +
              "$env:GITHUB_WORKSPACE. If $env:MYSQL_SOURCE_DIR/ is missing from " +
              'this checkout, it was not pushed to the GitHub repository this ' +
              'workflow is running in.')
          }
          Write-Output "Using MySQL source at $source"

          $versionFile = Get-Content -LiteralPath (Join-Path $source 'MYSQL_VERSION') -Raw
          $parts = foreach ($key in 'MAJOR', 'MINOR', 'PATCH') {
            $match = [regex]::Match($versionFile, "(?m)^MYSQL_VERSION_$key=(\d+)\s*$")
            if (-not $match.Success) {
              throw "Could not read MYSQL_VERSION_$key from the vendored source."
            }
            $match.Groups[1].Value
          }
          $version = $parts -join '.'

          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_VERSION=$version"
          # The staging step reads this instead of recomputing the path, so the
          # layout is resolved exactly once.
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_SOURCE_TREE=$source"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "PACKAGE_NAME=mysql-$version-$env:PACKAGE_PLATFORM"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "package_name=mysql-$version-$env:PACKAGE_PLATFORM"

          Write-Output "Building MySQL $version from $env:MYSQL_SOURCE_DIR/ in this repository."
          $info = Join-Path $source 'Docs\INFO_SRC'
          if (Test-Path -LiteralPath $info) {
            Get-Content -LiteralPath $info
          }

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          $required = 'cl', 'link', 'nmake', 'dumpbin', 'cmake', 'curl', 'tar'
          foreach ($tool in $required) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool not found: $tool"
            }
          }
          $perl = @(
            'C:\Strawberry\perl\bin\perl.exe',
            'C:\Strawberry\bin\perl.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $perl) {
            throw 'Strawberry Perl was not found on the Windows runner.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $perl)
          Add-Content -Path $env:GITHUB_ENV -Value "PERL_EXECUTABLE=$perl"
          cl 2>&1 | Select-Object -First 2
          cmake --version | Select-Object -First 1
          & $perl -v | Select-String 'This is perl'

      # MySQL's CMake wants a program named bison; winflexbison ships it as
      # win_bison.exe. The renamed copy has to stay in the package directory:
      # bison resolves its data\ skeleton directory relative to the executable,
      # and the chocolatey\bin entry is only a shim that resolves its target
      # relative to itself, so neither one survives being copied elsewhere.
      - name: Install bison
        shell: pwsh
        run: |
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install winflexbison3.'
          }
          $tool = Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib' -Recurse `
            -Filter 'win_bison.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tool) {
            throw 'win_bison.exe was not found under the Chocolatey library.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $tool.DirectoryName 'data'))) {
            throw "The bison data directory is missing next to $($tool.FullName)."
          }
          $bison = Join-Path $tool.DirectoryName 'bison.exe'
          Copy-Item -LiteralPath $tool.FullName -Destination $bison -Force

          # CMake's FindBISON only accepts output starting with "bison (GNU Bison)".
          $versionOutput = (& $bison --version 2>&1 | Out-String)
          Write-Output $versionOutput.Trim()
          if ($LASTEXITCODE -ne 0 -or
              $versionOutput -notmatch '(?m)^bison \(GNU Bison\) \d+\.\d+') {
            throw "bison --version did not report a usable version: $versionOutput"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value `
            "BISON_EXECUTABLE=$($bison -replace '\\', '/')"

      # Pinned OpenSSL, same version as the Linux artifacts. MySQL copies the DLLs
      # next to the binaries, so the package does not need a system OpenSSL.
      - name: Build pinned OpenSSL
        shell: pwsh
        run: |
          $version = $env:OPENSSL_VERSION
          $archive = Join-Path $env:RUNNER_TEMP "openssl-$version.tar.gz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'openssl'
          Remove-Item -LiteralPath $sourceRoot, $env:OPENSSL_ROOT `
            -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null

          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            "https://github.com/openssl/openssl/releases/download/$env:OPENSSL_TAG/openssl-$version.tar.gz" `
            -o $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the OpenSSL source.'
          }
          tar.exe -xzf $archive -C $sourceRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract the OpenSSL source.'
          }

          Push-Location (Join-Path $sourceRoot "openssl-$version")
          & $env:PERL_EXECUTABLE Configure VC-WIN64A shared no-asm `
            "--prefix=$env:OPENSSL_ROOT" "--openssldir=$env:OPENSSL_ROOT\ssl"
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL Configure failed.'
          }
          nmake
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL build failed.'
          }
          nmake install_sw
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL installation failed.'
          }
          Pop-Location

          $expected = @(
            "$env:OPENSSL_ROOT\include\openssl\ssl.h",
            "$env:OPENSSL_ROOT\lib\libssl.lib",
            "$env:OPENSSL_ROOT\lib\libcrypto.lib",
            "$env:OPENSSL_ROOT\bin\libssl-1_1-x64.dll",
            "$env:OPENSSL_ROOT\bin\libcrypto-1_1-x64.dll",
            "$env:OPENSSL_ROOT\bin\openssl.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing OpenSSL build output: $file"
            }
          }
          & "$env:OPENSSL_ROOT\bin\openssl.exe" version

      # MySQL's own source paths are long enough that building under the deep
      # workspace path risks MAX_PATH failures in the middle of a multi-hour
      # build, so the tree is staged at a short root first. robocopy is used
      # because it handles this many files far faster than Copy-Item.
      - name: Stage the vendored MySQL source at a short path
        shell: pwsh
        run: |
          $source = $env:MYSQL_SOURCE_TREE
          Remove-Item -LiteralPath $env:SOURCE_ROOT -Recurse -Force `
            -ErrorAction SilentlyContinue

          robocopy.exe $source $env:SOURCE_ROOT /E /NFL /NDL /NJH /NJS /NP /MT:8 |
            Out-Null
          # robocopy uses a bit field: < 8 means files were copied and/or were
          # already current, >= 8 means at least one copy actually failed.
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed to stage the MySQL source (exit $LASTEXITCODE)."
          }
          $global:LASTEXITCODE = 0

          if (-not (Test-Path -LiteralPath (Join-Path $env:SOURCE_ROOT 'CMakeLists.txt'))) {
            throw "The MySQL source was not staged as expected at $env:SOURCE_ROOT."
          }
          Add-Content -Path $env:GITHUB_ENV -Value `
            "MYSQL_SOURCE=$($env:SOURCE_ROOT -replace '\\', '/')"

          $staged = @(Get-ChildItem -LiteralPath $env:SOURCE_ROOT -Recurse -File).Count
          Write-Output "Staged $staged files into $env:SOURCE_ROOT."

      # Boost is the one build input the vendored source cannot supply: the plain
      # MySQL source tarball ships no boost/, and 8.0.25 needs the 1.73.0 headers.
      # It is extracted here rather than handed to cmake as an archive, so that
      # boost.cmake takes its "unzipped version" path.
      - name: Fetch pinned Boost headers
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:BOOST_PACKAGE_NAME.tar.gz"
          Remove-Item -LiteralPath $env:BOOST_ROOT_DIR -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:BOOST_ROOT_DIR | Out-Null

          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            "https://archives.boost.io/release/$env:BOOST_VERSION/source/$env:BOOST_PACKAGE_NAME.tar.gz" `
            -o $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the Boost source.'
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BOOST_SHA256.ToLowerInvariant()) {
            throw "Boost checksum mismatch: expected $env:BOOST_SHA256, got $hash"
          }

          tar.exe -xzf $archive -C $env:BOOST_ROOT_DIR
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract the Boost source.'
          }
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue

          # boost.cmake reads the version out of this header and insists on 1.73.
          $boostDirectory = Join-Path $env:BOOST_ROOT_DIR $env:BOOST_PACKAGE_NAME
          $versionHeader = Join-Path $boostDirectory 'boost\version.hpp'
          if (-not (Test-Path -LiteralPath $versionHeader)) {
            throw "Boost headers are missing: $versionHeader"
          }
          if (-not (Select-String -LiteralPath $versionHeader `
              -Pattern '^#define BOOST_VERSION 107300' -Quiet)) {
            throw "$versionHeader does not report Boost 1.73.0."
          }
          Add-Content -Path $env:GITHUB_ENV -Value `
            "BOOST_INCLUDE_ROOT=$($boostDirectory -replace '\\', '/')"

      # RelWithDebInfo, not Release: install_macros.cmake installs
      # $<TARGET_PDB_FILE:...> next to every .exe/.dll with no OPTIONAL, and a
      # Release build never produces those PDBs. cmake/os/Windows.cmake intends
      # to add /debug to CMAKE_${type}_LINKER_FLAGS_RELEASE so that it would,
      # but the $ is missing, so the assignment lands on a variable named
      # CMAKE_{type}_LINKER_FLAGS_RELEASE that nothing reads. Oracle's own
      # Windows packages are RelWithDebInfo, where cmake already puts /debug
      # on the linker flags; that is why the typo went unnoticed. Keep the
      # two --config values in lockstep: a Release install of a RelWithDebInfo
      # build (or the reverse) looks in the wrong output directory. Both read
      # env.MSVC_CONFIG so they cannot drift apart.
      - name: Configure and build MySQL from the vendored source
        shell: pwsh
        run: |
          # An out-of-source build keeps the staged tree reusable; MySQL's
          # CMakeLists refuses an in-source build outright.
          cmake -S "$env:MYSQL_SOURCE" -B "$env:BUILD_ROOT" `
            -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$($env:INSTALL_PREFIX -replace '\\', '/')" `
            "-DWITH_SSL=$($env:OPENSSL_ROOT -replace '\\', '/')" `
            "-DWITH_BOOST=$env:BOOST_INCLUDE_ROOT" `
            "-DBISON_EXECUTABLE=$env:BISON_EXECUTABLE" `
            -DWITH_ZLIB=bundled `
            -DWITH_ZSTD=bundled `
            -DWITH_LZ4=bundled `
            -DWITH_ICU=bundled `
            -DWITH_PROTOBUF=bundled `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_ROUTER=OFF
          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configuration failed.'
          }
          cmake --build "$env:BUILD_ROOT" --config $env:MSVC_CONFIG --parallel
          if ($LASTEXITCODE -ne 0) {
            throw 'The MySQL build failed.'
          }

          # The install rules require a PDB next to every .dll and .exe, so a
          # configuration that does not emit them fails halfway through the
          # install with a confusing "file INSTALL cannot find" message. Check
          # the one that install reaches first, while the build log is still
          # the thing being looked at.
          $pdb = Join-Path $env:BUILD_ROOT `
            "library_output_directory\$env:MSVC_CONFIG\libmysql.pdb"
          if (-not (Test-Path -LiteralPath $pdb)) {
            throw ("The $env:MSVC_CONFIG build produced no $pdb. MySQL's " +
              'install rules are not OPTIONAL for PDB files, so the install ' +
              'step would fail. Keep MSVC_CONFIG at RelWithDebInfo, or pass ' +
              'the /DEBUG linker flags described in the README.')
          }

          $drive = Get-PSDrive -Name C
          Write-Output ("C: free {0:N1} GB of {1:N1} GB after the MySQL build." -f `
            ($drive.Free / 1GB), (($drive.Used + $drive.Free) / 1GB))

      - name: Stage and verify Windows artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          # --config is not optional here. Without it cmake_install.cmake falls
          # back to Release, and a Release install of a RelWithDebInfo build
          # looks for PDB files in library_output_directory/Release, which does
          # not exist. The two checks after the install catch that regression.
          # stderr is deliberately left alone: merging it into the pipeline
          # turns cmake's diagnostics into ErrorRecords, and this shell runs
          # with $ErrorActionPreference = 'stop'.
          $log = Join-Path $env:RUNNER_TEMP 'mysql-install.log'
          cmake --install "$env:BUILD_ROOT" --config $env:MSVC_CONFIG `
            --prefix $stage | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw 'The MySQL installation step failed.'
          }

          # cmake_install.cmake only announces the configuration when it had to
          # choose one itself, which is to say when --config did not reach it.
          # So this line being present at all means the argument was dropped,
          # and the value it fell back to is the Release default. A successful
          # install with --config honored prints nothing here.
          $fallback = Select-String -LiteralPath $log `
            -Pattern 'Install configuration: "(.+)"' | Select-Object -First 1
          if ($fallback) {
            $reported = $fallback.Matches[0].Groups[1].Value
            if ($reported -ne $env:MSVC_CONFIG) {
              throw ("The install fell back to configuration '$reported' " +
                "instead of using '$env:MSVC_CONFIG'; the staged tree does " +
                'not match the build. Check that --config is still passed.')
            }
          }

          # The install rules copy a PDB next to every binary. Their presence
          # here proves the install read the $env:MSVC_CONFIG output tree, and
          # the packaging step below expects to find them to delete.
          $staged = @(Get-ChildItem -LiteralPath $stage -Recurse -Filter '*.pdb' `
            -File -ErrorAction SilentlyContinue)
          if ($staged.Count -eq 0) {
            throw "No PDB files were staged; the install did not read the $env:MSVC_CONFIG tree."
          }
          Write-Output ("Installed the $env:MSVC_CONFIG build into $stage " +
            "($($staged.Count) PDB files staged).")
          Add-Content -Path $env:GITHUB_ENV -Value "STAGE_DIRECTORY=$stage"

          foreach ($file in @('bin\mysqld.exe', 'bin\mysql.exe', 'bin\mysqladmin.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $file))) {
              throw "Missing from the staged package: $file"
            }
          }
          if (-not (Get-ChildItem -LiteralPath $stage -Recurse -Filter 'libssl-1_1-x64.dll')) {
            throw 'The bundled OpenSSL DLLs are missing from the staged package.'
          }
          $headers = (dumpbin /headers "$stage\bin\mysqld.exe" | Out-String)
          if ($headers -notmatch 'machine \(x64\)') {
            throw 'The build is not a Windows x64 executable.'
          }
          & "$stage\bin\mysqld.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'mysqld.exe --version failed.'
          }

      - name: Start mysqld and run a smoke test
        shell: pwsh
        run: |
          $stage = $env:STAGE_DIRECTORY
          $data = Join-Path $env:RUNNER_TEMP 'data'
          $stdout = Join-Path $env:RUNNER_TEMP 'mysqld.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'mysqld.err'
          $port = 13306
          Remove-Item -LiteralPath $data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          & "$stage\bin\mysqld.exe" --initialize-insecure --console `
            "--basedir=$stage" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) {
            throw 'mysqld --initialize-insecure failed.'
          }

          $server = Start-Process -FilePath "$stage\bin\mysqld.exe" -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -ArgumentList '--console', "--basedir=$stage", "--datadir=$data", `
              "--port=$port", '--loose-mysqlx=OFF'
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              & "$stage\bin\mysqladmin.exe" --protocol=tcp --host=127.0.0.1 `
                "--port=$port" --user=root ping 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stderr, $stdout -ErrorAction SilentlyContinue
              throw 'mysqld did not become ready.'
            }
            & "$stage\bin\mysql.exe" --protocol=tcp --host=127.0.0.1 "--port=$port" `
              --user=root --execute="SELECT VERSION(), @@version_compile_machine, @@version_compile_os;"
            if ($LASTEXITCODE -ne 0) {
              throw 'The MySQL client could not query the server.'
            }
            # Proves the bundled OpenSSL is usable at runtime, not just linkable.
            & "$stage\bin\mysql.exe" --protocol=tcp --host=127.0.0.1 "--port=$port" `
              --user=root --ssl-mode=REQUIRED --execute="SHOW STATUS LIKE 'Ssl_cipher';"
            if ($LASTEXITCODE -ne 0) {
              throw 'A TLS connection using the bundled OpenSSL failed.'
            }
          } finally {
            & "$stage\bin\mysqladmin.exe" --protocol=tcp --host=127.0.0.1 `
              "--port=$port" --user=root shutdown 2>$null | Out-Null
            if (-not $server.HasExited) {
              Start-Sleep -Seconds 10
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Package the Windows artifact
        shell: pwsh
        run: |
          $stage = $env:STAGE_DIRECTORY

          # The build has to be RelWithDebInfo (see the build step), which means
          # the install brings a PDB along for every binary. They are only useful
          # for crash analysis, they dwarf the binaries themselves, and Oracle
          # ships them as a separate download rather than inside the server zip,
          # so the runtime package drops them. The smoke test has already run
          # against this tree at this point, so nothing here still needs them.
          $pdbs = @(Get-ChildItem -LiteralPath $stage -Recurse -Filter '*.pdb' `
            -File -ErrorAction SilentlyContinue)
          if ($pdbs.Count -gt 0) {
            $pdbBytes = ($pdbs | Measure-Object -Property Length -Sum).Sum
            $pdbs | Remove-Item -Force
            Write-Output ("Dropped {0} PDB files ({1:N1} MB) from the package." -f `
              $pdbs.Count, ($pdbBytes / 1MB))
          } else {
            Write-Output 'No PDB files were present in the staged tree.'
          }

          $buildInfo = @"
          package_platform=$env:PACKAGE_PLATFORM
          mysql_version=$env:MYSQL_VERSION
          mysql_source=in-repo $env:MYSQL_SOURCE_DIR/ @ $env:GITHUB_SHA
          openssl_version=$env:OPENSSL_VERSION
          boost=$env:BOOST_PACKAGE_NAME (pinned, archives.boost.io)
          architecture=x64
          compiler=MSVC
          build_type=$env:MSVC_CONFIG (PDB files removed from this package)
          cmake=$(cmake --version | Select-Object -First 1)
          runner_image=windows-2022
          install_prefix=$env:INSTALL_PREFIX
          "@
          $buildInfo.Trim() | Set-Content -LiteralPath "$stage\BUILD-ENVIRONMENT.txt" `
            -Encoding ascii

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME.zip"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          tar.exe -a -c -f $archive -C $env:RUNNER_TEMP $env:PACKAGE_NAME
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the ZIP archive.'
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

          $entries = tar.exe -tf $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'The generated ZIP archive could not be listed.'
          }
          if (-not ($entries | Where-Object { $_ -like '*/bin/mysqld.exe' })) {
            throw 'mysqld.exe is missing from the generated ZIP archive.'
          }
          Get-ChildItem -LiteralPath 'dist' | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

