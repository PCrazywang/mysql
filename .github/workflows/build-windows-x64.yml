name: Windows x64

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      mysql_version:
        description: 'MySQL version to build, for example 8.0.25'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MYSQL_VERSION: 8.0.25
  MYSQL_SHA256: ''
  # MySQL 8.0.25 requires OpenSSL 1.x; 1.1.x release tags keep the old naming.
  OPENSSL_VERSION: 1.1.1w
  OPENSSL_TAG: OpenSSL_1_1_1w
  PACKAGE_PLATFORM: windows-x64
  # Short roots keep the MySQL source and build trees clear of MAX_PATH limits.
  SOURCE_ROOT: C:\mysql-src
  BUILD_ROOT: C:\mysql-build
  OPENSSL_ROOT: C:\openssl-x64
  INSTALL_PREFIX: C:\mysql

jobs:
  windows-x64:
    name: Windows x64 / MSVC
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve build inputs
        id: resolve
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.mysql_version }}
        run: |
          $version = $env:MYSQL_VERSION
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unexpected MySQL version: $version"
          }
          $series = ($version -split '\.')[0..1] -join '.'
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQL_SERIES=$series"
          # 8.0.x does not ship Boost in the plain source tarball (that starts
          # with 8.3), so the mysql-boost distribution is the one to fetch.
          Add-Content -Path $env:GITHUB_ENV -Value `
            "MYSQL_TARBALL=mysql-boost-$version.tar.gz"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "PACKAGE_NAME=mysql-$version-$env:PACKAGE_PLATFORM"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          $required = 'cl', 'link', 'nmake', 'dumpbin', 'cmake', 'curl', 'tar'
          foreach ($tool in $required) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool not found: $tool"
            }
          }
          $perl = @(
            'C:\Strawberry\perl\bin\perl.exe',
            'C:\Strawberry\bin\perl.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $perl) {
            throw 'Strawberry Perl was not found on the Windows runner.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $perl)
          Add-Content -Path $env:GITHUB_ENV -Value "PERL_EXECUTABLE=$perl"
          cl 2>&1 | Select-Object -First 2
          cmake --version | Select-Object -First 1
          & $perl -v | Select-String 'This is perl'

      # MySQL's CMake wants a program named bison; winflexbison ships it as
      # win_bison.exe. The renamed copy has to stay in the package directory:
      # bison resolves its data\ skeleton directory relative to the executable,
      # and the chocolatey\bin entry is only a shim that resolves its target
      # relative to itself, so neither one survives being copied elsewhere.
      - name: Install bison
        shell: pwsh
        run: |
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install winflexbison3.'
          }
          $tool = Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib' -Recurse `
            -Filter 'win_bison.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tool) {
            throw 'win_bison.exe was not found under the Chocolatey library.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $tool.DirectoryName 'data'))) {
            throw "The bison data directory is missing next to $($tool.FullName)."
          }
          $bison = Join-Path $tool.DirectoryName 'bison.exe'
          Copy-Item -LiteralPath $tool.FullName -Destination $bison -Force

          # CMake's FindBISON only accepts output starting with "bison (GNU Bison)".
          $versionOutput = (& $bison --version 2>&1 | Out-String)
          Write-Output $versionOutput.Trim()
          if ($LASTEXITCODE -ne 0 -or
              $versionOutput -notmatch '(?m)^bison \(GNU Bison\) \d+\.\d+') {
            throw "bison --version did not report a usable version: $versionOutput"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value `
            "BISON_EXECUTABLE=$($bison -replace '\\', '/')"

      # Pinned OpenSSL, same version as the Linux artifacts. MySQL copies the DLLs
      # next to the binaries, so the package does not need a system OpenSSL.
      - name: Build pinned OpenSSL
        shell: pwsh
        run: |
          $version = $env:OPENSSL_VERSION
          $archive = Join-Path $env:RUNNER_TEMP "openssl-$version.tar.gz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'openssl'
          Remove-Item -LiteralPath $sourceRoot, $env:OPENSSL_ROOT `
            -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null

          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            "https://github.com/openssl/openssl/releases/download/$env:OPENSSL_TAG/openssl-$version.tar.gz" `
            -o $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the OpenSSL source.'
          }
          tar.exe -xzf $archive -C $sourceRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract the OpenSSL source.'
          }

          Push-Location (Join-Path $sourceRoot "openssl-$version")
          & $env:PERL_EXECUTABLE Configure VC-WIN64A shared no-asm `
            "--prefix=$env:OPENSSL_ROOT" "--openssldir=$env:OPENSSL_ROOT\ssl"
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL Configure failed.'
          }
          nmake
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL build failed.'
          }
          nmake install_sw
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSL installation failed.'
          }
          Pop-Location

          $expected = @(
            "$env:OPENSSL_ROOT\include\openssl\ssl.h",
            "$env:OPENSSL_ROOT\lib\libssl.lib",
            "$env:OPENSSL_ROOT\lib\libcrypto.lib",
            "$env:OPENSSL_ROOT\bin\libssl-1_1-x64.dll",
            "$env:OPENSSL_ROOT\bin\libcrypto-1_1-x64.dll",
            "$env:OPENSSL_ROOT\bin\openssl.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing OpenSSL build output: $file"
            }
          }
          & "$env:OPENSSL_ROOT\bin\openssl.exe" version

      - name: Download MySQL source
        shell: pwsh
        run: |
          $version = $env:MYSQL_VERSION
          $archive = Join-Path $env:RUNNER_TEMP $env:MYSQL_TARBALL
          # Current releases live under Downloads/, older ones move to archives/.
          $bases = @(
            "https://cdn.mysql.com/Downloads/MySQL-$env:MYSQL_SERIES",
            "https://cdn.mysql.com/archives/mysql-$env:MYSQL_SERIES"
          )
          $downloaded = $false
          foreach ($base in $bases) {
            curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
              "$base/$env:MYSQL_TARBALL" -o $archive
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Downloaded $base/$env:MYSQL_TARBALL"
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) {
            throw 'Failed to download the MySQL source.'
          }
          if ($env:MYSQL_SHA256) {
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $env:MYSQL_SHA256.ToLowerInvariant()) {
              throw "MySQL source checksum mismatch: $hash"
            }
          }

          Remove-Item -LiteralPath $env:SOURCE_ROOT -Recurse -Force `
            -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:SOURCE_ROOT | Out-Null
          tar.exe -xzf $archive -C $env:SOURCE_ROOT
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract the MySQL source.'
          }
          $source = Join-Path $env:SOURCE_ROOT "mysql-$version"
          if (-not (Test-Path -LiteralPath (Join-Path $source 'CMakeLists.txt'))) {
            throw 'The MySQL source tree was not extracted as expected.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value `
            "MYSQL_SOURCE=$($source -replace '\\', '/')"

          # WITH_BOOST is mandatory for 8.0.x. Point it at the boost directory of
          # the mysql-boost tarball and let MySQL's own boost.cmake resolve what is
          # inside it: it accepts a boost_1_xx_0 subdirectory, a boost tarball, or
          # boost/version.hpp sitting directly in that directory.
          $boostDirectory = Join-Path $source 'boost'
          if (-not (Test-Path -LiteralPath $boostDirectory)) {
            Get-ChildItem -LiteralPath $source | Select-Object -First 30 -Property Name
            throw "No boost directory in $source; is this the mysql-boost tarball?"
          }
          Write-Output "Contents of ${boostDirectory}:"
          Get-ChildItem -LiteralPath $boostDirectory | Select-Object -Property Name, Length
          $boostPackage = (Get-ChildItem -LiteralPath $boostDirectory -Directory `
            -Filter 'boost_1_*' -ErrorAction SilentlyContinue |
            Select-Object -First 1).Name
          if (-not $boostPackage) {
            $boostPackage = 'bundled'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "BOOST_PACKAGE=$boostPackage"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "BOOST_ROOT_DIR=$($boostDirectory -replace '\\', '/')"

      # RelWithDebInfo, not Release: install_macros.cmake installs
      # $<TARGET_PDB_FILE:...> next to every .exe/.dll with no OPTIONAL, and a
      # Release build never produces those PDBs. cmake/os/Windows.cmake intends
      # to add /debug to CMAKE_${type}_LINKER_FLAGS_RELEASE so that it would,
      # but the $ is missing, so the assignment lands on a variable named
      # CMAKE_{type}_LINKER_FLAGS_RELEASE that nothing reads. Oracle's own
      # Windows packages are RelWithDebInfo, where cmake already puts /debug
      # on the linker flags; that is why the typo went unnoticed. Keep the
      # two --config values in lockstep: a Release install of a RelWithDebInfo
      # build (or the reverse) looks in the wrong output directory.
      - name: Configure and build MySQL
        shell: pwsh
        run: |
          cmake -S "$env:MYSQL_SOURCE" -B "$env:BUILD_ROOT" `
            -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$($env:INSTALL_PREFIX -replace '\\', '/')" `
            "-DWITH_SSL=$($env:OPENSSL_ROOT -replace '\\', '/')" `
            "-DWITH_BOOST=$env:BOOST_ROOT_DIR" `
            "-DBISON_EXECUTABLE=$env:BISON_EXECUTABLE" `
            -DWITH_ZLIB=bundled `
            -DWITH_ZSTD=bundled `
            -DWITH_LZ4=bundled `
            -DWITH_ICU=bundled `
            -DWITH_PROTOBUF=bundled `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_ROUTER=OFF
          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configuration failed.'
          }
          cmake --build "$env:BUILD_ROOT" --config RelWithDebInfo --parallel
          if ($LASTEXITCODE -ne 0) {
            throw 'The MySQL build failed.'
          }
          $drive = Get-PSDrive -Name C
          Write-Output ("C: free {0:N1} GB of {1:N1} GB after the MySQL build." -f `
            ($drive.Free / 1GB), (($drive.Used + $drive.Free) / 1GB))

      - name: Stage and verify Windows artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install "$env:BUILD_ROOT" --config RelWithDebInfo --prefix $stage
          if ($LASTEXITCODE -ne 0) {
            throw 'The MySQL installation step failed.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "STAGE_DIRECTORY=$stage"

          foreach ($file in @('bin\mysqld.exe', 'bin\mysql.exe', 'bin\mysqladmin.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $file))) {
              throw "Missing from the staged package: $file"
            }
          }
          if (-not (Get-ChildItem -LiteralPath $stage -Recurse -Filter 'libssl-1_1-x64.dll')) {
            throw 'The bundled OpenSSL DLLs are missing from the staged package.'
          }
          $headers = (dumpbin /headers "$stage\bin\mysqld.exe" | Out-String)
          if ($headers -notmatch 'machine \(x64\)') {
            throw 'The build is not a Windows x64 executable.'
          }
          & "$stage\bin\mysqld.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'mysqld.exe --version failed.'
          }

      - name: Start mysqld and run a smoke test
        shell: pwsh
        run: |
          $stage = $env:STAGE_DIRECTORY
          $data = Join-Path $env:RUNNER_TEMP 'data'
          $stdout = Join-Path $env:RUNNER_TEMP 'mysqld.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'mysqld.err'
          $port = 13306
          Remove-Item -LiteralPath $data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          & "$stage\bin\mysqld.exe" --initialize-insecure --console `
            "--basedir=$stage" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) {
            throw 'mysqld --initialize-insecure failed.'
          }

          $server = Start-Process -FilePath "$stage\bin\mysqld.exe" -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -ArgumentList '--console', "--basedir=$stage", "--datadir=$data", `
              "--port=$port", '--loose-mysqlx=OFF'
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              & "$stage\bin\mysqladmin.exe" --protocol=tcp --host=127.0.0.1 `
                "--port=$port" --user=root ping 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stderr, $stdout -ErrorAction SilentlyContinue
              throw 'mysqld did not become ready.'
            }
            & "$stage\bin\mysql.exe" --protocol=tcp --host=127.0.0.1 "--port=$port" `
              --user=root --execute="SELECT VERSION(), @@version_compile_machine, @@version_compile_os;"
            if ($LASTEXITCODE -ne 0) {
              throw 'The MySQL client could not query the server.'
            }
            # Proves the bundled OpenSSL is usable at runtime, not just linkable.
            & "$stage\bin\mysql.exe" --protocol=tcp --host=127.0.0.1 "--port=$port" `
              --user=root --ssl-mode=REQUIRED --execute="SHOW STATUS LIKE 'Ssl_cipher';"
            if ($LASTEXITCODE -ne 0) {
              throw 'A TLS connection using the bundled OpenSSL failed.'
            }
          } finally {
            & "$stage\bin\mysqladmin.exe" --protocol=tcp --host=127.0.0.1 `
              "--port=$port" --user=root shutdown 2>$null | Out-Null
            if (-not $server.HasExited) {
              Start-Sleep -Seconds 10
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Package the Windows artifact
        shell: pwsh
        run: |
          $stage = $env:STAGE_DIRECTORY

          # The build has to be RelWithDebInfo (see the build step), which means
          # the install brings a PDB along for every binary. They are only useful
          # for crash analysis, they dwarf the binaries themselves, and Oracle
          # ships them as a separate download rather than inside the server zip,
          # so the runtime package drops them. The smoke test has already run
          # against this tree at this point, so nothing here still needs them.
          $pdbs = @(Get-ChildItem -LiteralPath $stage -Recurse -Filter '*.pdb' `
            -File -ErrorAction SilentlyContinue)
          if ($pdbs.Count -gt 0) {
            $pdbBytes = ($pdbs | Measure-Object -Property Length -Sum).Sum
            $pdbs | Remove-Item -Force
            Write-Output ("Dropped {0} PDB files ({1:N1} MB) from the package." -f `
              $pdbs.Count, ($pdbBytes / 1MB))
          } else {
            Write-Output 'No PDB files were present in the staged tree.'
          }

          $buildInfo = @"
          package_platform=$env:PACKAGE_PLATFORM
          mysql_version=$env:MYSQL_VERSION
          openssl_version=$env:OPENSSL_VERSION
          boost=$env:BOOST_PACKAGE
          architecture=x64
          compiler=MSVC
          build_type=RelWithDebInfo (PDB files removed from this package)
          cmake=$(cmake --version | Select-Object -First 1)
          runner_image=windows-2022
          install_prefix=$env:INSTALL_PREFIX
          "@
          $buildInfo.Trim() | Set-Content -LiteralPath "$stage\BUILD-ENVIRONMENT.txt" `
            -Encoding ascii

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME.zip"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          tar.exe -a -c -f $archive -C $env:RUNNER_TEMP $env:PACKAGE_NAME
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the ZIP archive.'
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

          $entries = tar.exe -tf $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'The generated ZIP archive could not be listed.'
          }
          if (-not ($entries | Where-Object { $_ -like '*/bin/mysqld.exe' })) {
            throw 'mysqld.exe is missing from the generated ZIP archive.'
          }
          Get-ChildItem -LiteralPath 'dist' | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Publish the verified artifact to a GitHub Release when a version tag (v*)
  # is pushed. The Linux workflow publishes into the same tag; whichever job
  # runs first creates the release, the other only uploads its own assets.
  release:
    name: Publish GitHub Release
    needs: [windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Guard against mismatched version tags
        id: guard
        env:
          INPUT_VERSION: ${{ inputs.mysql_version }}
        run: |
          set -eu
          version="$MYSQL_VERSION"
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          fi
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            "v${version}") ;;
            *) echo "Tag '${tag}' does not match MySQL version '${version}'; refusing to publish." >&2; exit 1 ;;
          esac
          {
            echo "package_name=mysql-${version}-${PACKAGE_PLATFORM}"
            echo "release_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.guard.outputs.package_name }}
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.guard.outputs.release_tag }}
        run: |
          set -eu
          ls -lh dist
          # The Linux workflow may publish into the same tag in parallel:
          # create if missing, otherwise just attach this platform's assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "MySQL ${MYSQL_VERSION}" \
              --notes "Automated release of MySQL ${MYSQL_VERSION}.

            - Platform: ${PACKAGE_PLATFORM} (MSVC / VS 2022)
            - See BUILD-ENVIRONMENT.txt inside the package."
          fi
          gh release view "$RELEASE_TAG" \
            --json tagName,assets --jq '.tagName, (.assets[].name)'

