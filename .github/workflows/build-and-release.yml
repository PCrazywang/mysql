name: Build and Release MySQL

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source-version:
    name: Resolve vendored source version
    runs-on: ubuntu-latest
    outputs:
      mysql_version: ${{ steps.version.outputs.mysql_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      linux_package_name: ${{ steps.version.outputs.linux_package_name }}
      windows_package_name: ${{ steps.version.outputs.windows_package_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate MySQL version
        id: version
        run: |
          set -eu
          source_dir=source
          version_file="$source_dir/MYSQL_VERSION"
          test -f "$version_file"

          read_version_part() {
            sed -n "s/^${1}=\([0-9][0-9]*\)[[:space:]]*$/\1/p" "$version_file"
          }
          major="$(read_version_part MYSQL_VERSION_MAJOR)"
          minor="$(read_version_part MYSQL_VERSION_MINOR)"
          patch="$(read_version_part MYSQL_VERSION_PATCH)"
          test -n "$major" && test -n "$minor" && test -n "$patch"
          version="${major}.${minor}.${patch}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            case "$tag" in
              "v${version}") ;;
              v*-[A-Za-z0-9.-]*)
                echo "Pre-release tag '${tag}' is not supported; push stable tag v${version}." >&2
                exit 1
                ;;
              *)
                echo "Tag '${tag}' does not match the vendored MySQL source version '${version}'; refusing to publish." >&2
                exit 1
                ;;
            esac
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "mysql_version=$version"
            echo "linux_package_name=mysql-${version}-linux-arm64-uos20"
            echo "windows_package_name=mysql-${version}-windows-x64"
          } >> "$GITHUB_OUTPUT"

  linux-arm64-uos20:
    name: Linux ARM64 (UOS 20 compatible)
    needs: resolve-source-version
    uses: ./.github/workflows/build-linux-uos20.yml

  windows-x64:
    name: Windows x64
    needs: resolve-source-version
    uses: ./.github/workflows/build-windows-x64.yml

  release:
    name: Publish GitHub Release
    needs: [resolve-source-version, linux-arm64-uos20, windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.resolve-source-version.outputs.linux_package_name }}
          path: dist/linux-arm64-uos20

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.resolve-source-version.outputs.windows_package_name }}
          path: dist/windows-x64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MYSQL_RELEASE_VERSION: ${{ needs.resolve-source-version.outputs.mysql_version }}
          RELEASE_TAG: ${{ needs.resolve-source-version.outputs.release_tag }}
        run: |
          set -eu
          linux_package="mysql-${MYSQL_RELEASE_VERSION}-linux-arm64-uos20.tar.gz"
          windows_package="mysql-${MYSQL_RELEASE_VERSION}-windows-x64.zip"
          assets=(
            "dist/linux-arm64-uos20/${linux_package}"
            "dist/linux-arm64-uos20/${linux_package}.sha256"
            "dist/windows-x64/${windows_package}"
            "dist/windows-x64/${windows_package}.sha256"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "MySQL ${MYSQL_RELEASE_VERSION}" \
            --generate-notes

      - name: Validate generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MYSQL_RELEASE_VERSION: ${{ needs.resolve-source-version.outputs.mysql_version }}
          RELEASE_TAG: ${{ needs.resolve-source-version.outputs.release_tag }}
        run: |
          set -eu
          expected_assets=(
            "mysql-${MYSQL_RELEASE_VERSION}-linux-arm64-uos20.tar.gz"
            "mysql-${MYSQL_RELEASE_VERSION}-linux-arm64-uos20.tar.gz.sha256"
            "mysql-${MYSQL_RELEASE_VERSION}-windows-x64.zip"
            "mysql-${MYSQL_RELEASE_VERSION}-windows-x64.zip.sha256"
          )
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${expected_assets[@]}"; do
            printf '%s\n' "$actual_assets" | grep -Fx -- "$asset" >/dev/null
          done
